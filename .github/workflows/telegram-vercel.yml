name: Telegram Vercel Deployment Notification

on:
  workflow_dispatch:
    inputs:
      status:
        description: 'Test Status'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - success
          - failed
          - canceled
      environment:
        description: 'Deployment Environment'
        required: false
        default: 'Production'
        type: string
      url:
        description: 'Deployment URL'
        required: false
        default: 'https://vscode-portfolio-xi-wine.vercel.app'
        type: string
  repository_dispatch:
    types:
      - vercel.deployment.success
      - vercel.deployment.error
      - vercel.deployment.failed
      - vercel.deployment.canceled
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  telegram-notification:
    name: Verify & Notify Telegram
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'deployment_status' ||
      contains(fromJSON('["success", "failure", "error", "canceled"]'), github.event.deployment_status.state)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Playwright Live Verification
        id: playwright_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_URL: ${{ inputs.url }}
          DISPATCH_URL: ${{ github.event.client_payload.url }}
          DEPLOY_TARGET_URL: ${{ github.event.deployment_status.target_url }}
          DEPLOY_ENV_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -e

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_URL="${INPUT_URL:-https://vscode-portfolio-xi-wine.vercel.app}"
          elif [ "$EVENT_NAME" = "deployment_status" ]; then
            TARGET_URL="${DEPLOY_TARGET_URL:-${DEPLOY_ENV_URL:-https://vscode-portfolio-xi-wine.vercel.app}}"
          else
            TARGET_URL="${DISPATCH_URL:-https://vscode-portfolio-xi-wine.vercel.app}"
          fi

          echo "Target URL for Playwright: $TARGET_URL"
          export DEPLOY_URL="$TARGET_URL"

          npm install playwright
          npx playwright install chromium --with-deps

          node scripts/verify-deployment.js "$TARGET_URL"

      - name: Send Telegram Notification with Screenshot
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          INPUT_STATUS: ${{ inputs.status }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_URL: ${{ inputs.url }}
          DISPATCH_ACTION: ${{ github.event.action }}
          DISPATCH_ENV: ${{ github.event.client_payload.environment }}
          DISPATCH_URL: ${{ github.event.client_payload.url }}
          DEPLOY_STATE: ${{ github.event.deployment_status.state }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
          DEPLOY_TARGET_URL: ${{ github.event.deployment_status.target_url }}
          DEPLOY_ENV_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -eu

          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "::error::Secret TELEGRAM_BOT_TOKEN is not configured in this repository."
            exit 1
          fi

          if [ -z "${CHAT_ID:-}" ]; then
            echo "::error::Secret TELEGRAM_CHAT_ID is not configured in this repository."
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TEST_STATUS="${INPUT_STATUS:-manual}"
            case "$TEST_STATUS" in
              success)
                STATUS="SUCCESS"
                EMOJI="✅"
                HEADER="VERCEL DEPLOYMENT SUCCESS & VERIFIED"
                ;;
              failed)
                STATUS="FAILED"
                EMOJI="❌"
                HEADER="VERCEL DEPLOYMENT FAILED"
                ;;
              canceled)
                STATUS="CANCELED"
                EMOJI="⚠️"
                HEADER="VERCEL DEPLOYMENT CANCELED"
                ;;
              *)
                STATUS="MANUAL TEST"
                EMOJI="🧪"
                HEADER="TELEGRAM NOTIFICATION & PLAYWRIGHT TEST"
                ;;
            esac
            EVENT_TYPE="workflow_dispatch"
            ENVIRONMENT="${INPUT_ENVIRONMENT:-Production}"
            DEPLOY_URL="${INPUT_URL:-https://vscode-portfolio-xi-wine.vercel.app}"

          elif [ "$EVENT_NAME" = "deployment_status" ]; then
            case "$DEPLOY_STATE" in
              success)
                STATUS="SUCCESS"
                EMOJI="✅"
                HEADER="VERCEL DEPLOYMENT SUCCESS & VERIFIED"
                EVENT_TYPE="vercel.deployment.success"
                ;;
              canceled)
                STATUS="CANCELED"
                EMOJI="⚠️"
                HEADER="VERCEL DEPLOYMENT CANCELED"
                EVENT_TYPE="vercel.deployment.canceled"
                ;;
              failure|error)
                STATUS="FAILED"
                EMOJI="❌"
                HEADER="VERCEL DEPLOYMENT FAILED"
                EVENT_TYPE="vercel.deployment.failed"
                ;;
              *)
                echo "Ignoring non-terminal deployment state: $DEPLOY_STATE"
                exit 0
                ;;
            esac
            ENVIRONMENT="${DEPLOY_ENV:-Production}"
            DEPLOY_URL="${DEPLOY_TARGET_URL:-${DEPLOY_ENV_URL:-Unavailable}}"

          else
            EVENT_TYPE="${DISPATCH_ACTION:-unknown}"
            ENVIRONMENT="${DISPATCH_ENV:-Production}"
            DEPLOY_URL="${DISPATCH_URL:-Unavailable}"

            case "$EVENT_TYPE" in
              vercel.deployment.success)
                STATUS="SUCCESS"
                EMOJI="✅"
                HEADER="VERCEL DEPLOYMENT SUCCESS & VERIFIED"
                ;;
              vercel.deployment.canceled)
                STATUS="CANCELED"
                EMOJI="⚠️"
                HEADER="VERCEL DEPLOYMENT CANCELED"
                ;;
              vercel.deployment.error|vercel.deployment.failed)
                STATUS="FAILED"
                EMOJI="❌"
                HEADER="VERCEL DEPLOYMENT FAILED"
                ;;
              *)
                STATUS="NOTIFICATION"
                EMOJI="ℹ️"
                HEADER="VERCEL DEPLOYMENT UPDATE"
                ;;
            esac
          fi

          PLAYWRIGHT_INFO="Playwright: Live Verification Complete"
          if [ -f "playwright-summary.json" ]; then
            P_DURATION=$(node -e "try { console.log(require('./playwright-summary.json').duration || '1.5') } catch { console.log('1.5') }")
            P_STATUS=$(node -e "try { console.log(require('./playwright-summary.json').status || '200') } catch { console.log('200') }")
            P_TITLE=$(node -e "try { console.log(require('./playwright-summary.json').title || '') } catch { console.log('') }")
            PLAYWRIGHT_INFO=$(printf "Playwright E2E: Status %s OK (Loaded in %ss)\nTitle: %s\nVerified: Skills ✓ Education ✓ Projects ✓ Contact ✓" \
              "$P_STATUS" "$P_DURATION" "$P_TITLE")
          fi

          MESSAGE=$(printf "%s %s\n\nStatus: %s\nRepository: %s\nEnvironment: %s\nDeployment URL: %s\n\n%s\n\nEvent: %s" \
            "$EMOJI" "$HEADER" "$STATUS" "$REPOSITORY" "$ENVIRONMENT" "$DEPLOY_URL" "$PLAYWRIGHT_INFO" "$EVENT_TYPE")

          CLEAN_TOKEN=$(echo -n "${BOT_TOKEN}" | tr -d '[:space:]' | sed 's/^bot//')
          CLEAN_CHAT_ID=$(echo -n "${CHAT_ID}" | tr -d '[:space:]')

          if [ -f "screenshot.png" ]; then
            echo "Dispatching photo notification with Playwright screenshot to Telegram..."
            set +e
            RESPONSE=$(curl --ipv4 --connect-timeout 20 --max-time 45 \
              --silent --show-error \
              --request POST \
              "https://api.telegram.org/bot${CLEAN_TOKEN}/sendPhoto" \
              -F "chat_id=${CLEAN_CHAT_ID}" \
              -F "photo=@screenshot.png" \
              -F "caption=${MESSAGE}" 2>&1)
            CURL_EXIT=$?
            set -e

            echo "Telegram sendPhoto Response: $RESPONSE"

            if [ $CURL_EXIT -eq 0 ] && echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "Telegram photo notification sent successfully."
              exit 0
            fi
            echo "Photo upload did not succeed, falling back to sendMessage..."
          fi

          echo "Dispatching text message to Telegram..."
          set +e
          RESPONSE=$(curl --ipv4 --connect-timeout 15 --max-time 30 \
            --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${CLEAN_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CLEAN_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" 2>&1)
          CURL_EXIT=$?
          set -e

          echo "Telegram API Response: $RESPONSE"

          if [ $CURL_EXIT -ne 0 ]; then
            echo "::error::Network error connecting to Telegram API (exit code $CURL_EXIT): $RESPONSE"
            exit 1
          fi

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Notification sent successfully."
          else
            echo "::error::Telegram API rejected request: $RESPONSE"
            exit 1
          fi
